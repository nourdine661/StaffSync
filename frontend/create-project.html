<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Project | StaffSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    (() => {
      const saved = localStorage.getItem('theme_preference');
      if (saved === 'dark') document.documentElement.classList.add('theme-dark');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="dashboard-body">
  <main class="container dashboard-layout">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>Create Project</h1>
      </div>
      <a class="btn btn-ghost" href="./admin.html">Back to Admin</a>
    </header>

    <section class="card reveal-up" style="max-width: 780px;">
      <p class="subtitle">Fill out the details below to create a new project.</p>
      <form id="createProjectForm" class="form-grid">
        <label>
          <span>Department</span>
          <input id="cpDepartment" type="text" placeholder="e.g. Engineering" required />
        </label>
        <label>
          <span>Description</span>
          <textarea id="cpDescription" rows="3" placeholder="What is this project about?"></textarea>
        </label>
        <label>
          <span>Budget</span>
          <input id="cpBudget" type="number" min="0" step="100" placeholder="12000" />
        </label>
        <label>
          <span>Start Date</span>
          <input id="cpStart" type="date" required />
        </label>
        <label>
          <span>End Date</span>
          <input id="cpEnd" type="date" />
        </label>
        <p class="hint">Projects default to active; adjust later in Admin if needed.</p>
        <label>
          <span>Owner (employee id)</span>
          <input id="cpOwner" type="number" min="1" placeholder="Optional" />
        </label>
        <button class="btn btn-primary" type="submit">Create Project</button>
      </form>
      <p id="cpMessage" class="message" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./js/theme.js"></script>
  <script type="module" src="./js/create-project.js"></script>
</body>
</html>
